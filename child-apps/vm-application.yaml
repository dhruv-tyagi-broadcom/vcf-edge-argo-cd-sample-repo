apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vm-app
  namespace: dev-r734w
spec:
  project: default
  source:
    repoURL: 'https://github.com/dhruv-tyagi-broadcom/vcf-edge-argo-cd-sample-repo.git'
    targetRevision: main
    path: apps/vm-app
    directory:
      recurse: true
  destination:
    server: 'https://10.1.8.135:443'
    namespace: dev-r734w
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
