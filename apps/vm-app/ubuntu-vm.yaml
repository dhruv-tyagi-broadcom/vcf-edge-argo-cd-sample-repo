apiVersion: vmoperator.vmware.com/v1alpha5
kind: VirtualMachine
metadata:
  name: vcf-edge-sample-ubuntu-vm
  namespace: dev-r734w
  labels:
    vm-selector: vcf-edge-sample-ubuntu-vm
    topology.kubernetes.io/zone: z-wld-a
spec:
  className: best-effort-medium
  # Friendly image name: Ubuntu 22.04 LTS Minimal - Jammy - 22.04.20260519
  imageName: vmi-b59a338f867943c6d
  storageClass: vsan-default-storage-policy
  powerState: PoweredOn
  volumes:
    - name: vcf-edge-sample-ubuntu-vm-pvc-0
      persistentVolumeClaim:
        claimName: vcf-edge-sample-ubuntu-vm-pvc-0
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vcf-edge-sample-ubuntu-vm-pvc-0
  namespace: dev-r734w
  labels:
    vm-selector: vcf-edge-sample-ubuntu-vm
  annotations:
    csi.vsphere.volume-requested-topology: '[{"topology.kubernetes.io/zone":"z-wld-a"}]'
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Block
  resources:
    requests:
      storage: 20Gi
  storageClassName: vsan-default-storage-policy

