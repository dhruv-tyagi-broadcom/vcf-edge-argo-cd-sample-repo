apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parent-app
  namespace: dev-r734w
spec:
  project: default
  source:
    repoURL: 'https://github.com/dhruv-tyagi-broadcom/vcf-edge-argo-cd-sample-repo.git'
    targetRevision: main
    path: child-apps    
    directory:
      recurse: true   
  destination:
    server: dev-r734w
    namespace: dev-r734w
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
